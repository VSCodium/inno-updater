name: Publish

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - name: Test
        run: cargo test --locked --target i686-pc-windows-msvc

      - name: Build release binary
        run: cargo build --release --locked --target i686-pc-windows-msvc

      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'inno_updater').version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$env:VERSION" "target/i686-pc-windows-msvc/release/inno_updater.exe" --title "v$env:VERSION" --generate-notes --target "$env:GITHUB_SHA"